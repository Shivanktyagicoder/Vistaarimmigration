<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <meta name="description" content="Vistaar Immigration — Expert visa consultancy for UK, Canada, USA, Australia and Schengen. Student, work, visitor and PR visas with a 98% success rate." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0D9488" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Vistaar Immigration — Your Visa Journey Starts Here" />
  <meta property="og:description" content="Expert immigration consultancy trusted by thousands. Student, work, visitor and PR visas for UK, Canada, USA, Australia and Europe." />
  <meta property="og:url" content="https://vistaarimmigration.com" />
  <meta property="og:image" content="https://vistaarimmigration.com/logo.png" />
  <meta property="og:site_name" content="Vistaar Immigration" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Vistaar Immigration" />
  <meta name="twitter:description" content="Expert visa consultancy — UK, Canada, USA, Schengen & more. 98% success rate." />
  <meta name="twitter:image" content="https://vistaarimmigration.com/logo.png" />

  <title>Vistaar Immigration — Expert Visa Consultancy</title>

  <!-- Performance: wake backend early so form is ready when user reaches contact page -->
  <link rel="preconnect" href="https://vistaarimmigration.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://vistaarimmigration.onrender.com" />

  <!-- Critical resource: logo preloaded so it appears instantly on first paint -->
  <link rel="preload" as="image" href="/logo.png" fetchpriority="high" />

  <!-- Google Fonts: preconnect before stylesheet fetch -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
